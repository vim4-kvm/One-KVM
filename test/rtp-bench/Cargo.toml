[package]
name = "onekvm-rtp-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
# Compile the production first-packet playout-delay branch.
default = ["vim4", "openssl-hmac"]
vim4 = []
openssl-hmac = ["srtp/openssl-hmac"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "=1.12.1"
rand = "0.10"
rtp = "=0.17.2"
serde_json = "=1.0.151"
sha2 = "0.11"
socket2 = "0.6"
tokio = { version = "=1.53.1", features = ["full"] }
tracing = "0.1"
webrtc = { version = "=0.17.2", features = ["vendored-openssl"] }
srtp = { package = "webrtc-srtp", version = "=0.17.2" }

[patch.crates-io]
dtls = { path = "../../libs/dtls" }
webrtc-srtp = { path = "../../libs/srtp" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
