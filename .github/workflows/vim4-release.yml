name: VIM4 release

# Builds this repository's VIM4 Ubuntu package with the shared recipes in
# vim4-kvm/vim4-kvm. Pull requests and manual runs verify only; pushing a
# release-* tag or dispatching with "publish" creates the GitHub release that
# the board's updater reads.
on:
  pull_request:
    branches: [vim4]
  push:
    branches: [vim4]
    tags: ['release-*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    uses: vim4-kvm/vim4-kvm/.github/workflows/release-component.yml@main
    permissions:
      contents: write
    with:
      component: onekvm
      repository: One-KVM
      publish: ${{ startsWith(github.ref, 'refs/tags/release-') || inputs.publish == true }}
